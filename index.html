<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO - Mail Server Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header class="app-header d-flex justify-content-between align-items-center px-4 py-3">
        <div class="logo">NOVO<span>.</span></div>
        <div class="status-badge px-3 py-1">
            Servidor Activo • <span id="counter-badge">0</span> pendientes
        </div>
    </header>

    <main class="container-fluid my-4 px-4">
        <div class="row g-4">

            <section class="col-12 col-md-6 d-flex flex-column">
                <div class="panel p-4 h-100">
                    <h2>Panel de Control</h2>

                    <div class="mb-4">
                        <button id="btn-open-compose" class="redactar btn-primary-novo w-100 py-3 mb-3">Redactar Nuevo
                            Correo</button>
                        <button id="btn-send" class="btn-secondary-novo w-100 py-3">Enviar Siguiente Correo</button>
                    </div>

                    <div class="status-container d-flex flex-column gap-3">
                        <div class="status-box p-3">
                            <h3>Enviando Ahora</h3>
                            <div id="current-mail" class="mail-card-placeholder p-3 text-center">
                                <p class="m-0">No hay correos procesándose en este momento</p>
                            </div>
                        </div>

                        <div class="status-box p-3">
                            <h3>Próximo en Cola</h3>
                            <div id="next-mail" class="mail-card-placeholder p-3 text-center">
                                <p class="m-0">Cola vacía</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="col-12 col-md-3">
                <div class="panel p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="m-0">Cola de Espera</h2>
                        <span class="count px-2 py-1" id="queue-count">0</span>
                    </div>
                    <div id="queue-list" class="mail-list d-flex flex-column gap-2">
                    </div>
                </div>
            </section>

            <section class="col-12 col-md-3">
                <div class="panel p-4 h-100">
                    <h2>Historial</h2>
                    <div id="history-list" class="mail-list d-flex flex-column gap-2">
                    </div>
                </div>
            </section>

        </div>
    </main>

    <div id="gmail-popup" class="gmail-composer d-none shadow-lg">
        <div class="composer-header d-flex justify-content-between align-items-center px-3 py-2">
            <span class="fw-bold text-white small">Mensaje Nuevo</span>
            <div class="composer-actions">
                <button id="btn-close-composer" class="btn-close-custom">&times;</button>
            </div>
        </div>
        <form id="mail-form" class="p-3">
            <div class="mb-2">
                <input type="text" id="remitente" class="form-control-novo" name="remitente"
                    placeholder="Para: remitente@novo.com">
            </div>
            <div class="mb-2">
                <input type="text" id="destinatario" class="form-control-novo" name="destinatario" required
                    placeholder="Destinatario: destino@mail.com">
            </div>
            <div class="mb-2">
                <input type="text" id="asunto" class="form-control-novo" name="asunto" required placeholder="Asunto">
            </div>
            <div class="mb-3">
                <textarea id="text" class="form-control-novo text-area-novo" name="mensaje" required
                    placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>
            <div class="justify-content-between align-items-center d-flex">
                <div class="d-flex justify-content-between align-items-center">
                    <button type="submit" id="btn-add" class="btn-send-gmail px-4 py-2">Agregar a la Cola</button>
                </div>
            </div>
        </form>
    </div>

    <div id="alerta" class="alert alert-danger d-none" role="alert">
        No tiene mas correos que enviar!
    </div>


    <audio id="send-sound" src="./audios/mixkit-fantasy-game-success-notification-270.wav" preload="auto"></audio>
    <audio id="tryAgain-sound" src="./audios/mixkit-bell-notification-933.wav" preload="auto"></audio>
    <audio id="failed-sound" src="./audios/mixkit-wrong-answer-fail-notification-946.wav" preload="auto"></audio>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>
</body>

</html>
